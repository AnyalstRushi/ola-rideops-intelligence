services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ola_rideops
      POSTGRES_USER: ola_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_for_local_dev}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ola_user -d ola_rideops"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    environment:
      OLA_DATA_PATH: /app/data/sample/bookings_sample.csv
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
