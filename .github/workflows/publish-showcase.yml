name: Publish RideOps showcase
on:
  push:
    branches: [main]
    paths:
      - 'showcase/**'
      - 'assets/**'
      - 'metrics.json'
      - 'index.html'
      - 'README.md'
      - '.github/workflows/publish-showcase.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: rideops-pages
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare allowlisted public site
        run: |
          test -s showcase/index.html
          test -s metrics.json
          mkdir -p _site/showcase _site/assets
          cp showcase/index.html _site/showcase/index.html
          cp metrics.json _site/metrics.json
          cp index.html _site/index.html
          cp README.md _site/README.md
          cp assets/rideops-hero.svg _site/assets/rideops-hero.svg
          touch _site/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload public site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy public site
        id: deployment
        uses: actions/deploy-pages@v4
